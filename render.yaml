services:
  - type: web
    name: buildphase
    env: python
    region: singapore
    plan: free
    buildCommand: pip install --upgrade pip && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT --app-dir segvision_app
    autoDeploy: true
